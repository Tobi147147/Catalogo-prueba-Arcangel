<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta / Catálogo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      background: #000;
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    nav a:hover {
      color: #00c3ff;
    }

    .buscador {
      width: 60%;
      padding: 8px;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    section {
      display: none;
      padding: 20px;
      animation: fade 0.3s ease-in-out;
    }

    section.activo {
      display: block;
    }

    @keyframes fade {
      from {opacity: 0}
      to {opacity: 1}
    }

    .contenedor {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1c1c1c;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
    }

    .precio {
      color: #00ff88;
      margin-top: 10px;
      font-weight: bold;
    }

    footer {
      background: #000;
      text-align: center;
      padding: 20px;
      margin-top: 20px;
    }

    .redes a {
      margin: 0 10px;
      color: #00c3ff;
      text-decoration: none;
    }

  </style>
</head>
<body>

<header>
  <nav>
    <a onclick="mostrarSeccion('catalogo')">Catálogo</a>
    <a onclick="mostrarSeccion('ubicacion')">Ubicación</a>
    <a onclick="mostrarSeccion('resenas')">Reseñas</a>
  </nav>
  <input type="text" id="busqueda" class="buscador" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
</header>

<!-- CATALOGO -->
<section id="catalogo" class="activo">
  <h2>Catálogo de Indumentaria</h2>

  <div style="margin-bottom:20px;">
    <button onclick="filtrarCategoria('todos')">Todos</button>
    <button onclick="filtrarCategoria('remeras')">Remeras</button>
    <button onclick="filtrarCategoria('pantalones')">Pantalones</button>
    <button onclick="filtrarCategoria('buzos')">Buzos</button>
  </div>
  <h2>Menú / Carta</h2>
  <div class="contenedor" id="productos"></div>
</section>

<!-- UBICACION -->
<section id="ubicacion">
  <h2>Ubicación</h2>
  <p>Estamos en Buenos Aires, Argentina 📍</p>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6577.349281552446!2d-58.73154231504387!3d-34.48577716682259!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bca3e0df787f57%3A0x830bc071a391b274!2sTienda%20de%20Ropa%20%7C%20Arcangel%20%7C%20Gorras%20y%20Calzado!5e0!3m2!1ses!2sar!4v1773863482428!5m2!1ses!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>" width="100%" height="300" style="border:0;"></iframe>
</section>

<!-- RESEÑAS -->
<section id="resenas">
  <h2>Reseñas</h2>

  <div id="listaResenas"></div>

  <button onclick="mostrarLoginAdmin()">Modo Admin</button>

  <div id="adminPanel" style="display:none; margin-top:20px;">
    <input type="password" id="adminPass" placeholder="Clave de administrador">
    <button onclick="activarModoAdmin()">Entrar</button>
  </div>
</section>

<footer>
  <p>Seguinos en redes</p>
  <div class="redes">
    <a href="#">Instagram</a>
    <a href="#">Facebook</a>
    <a href="#">WhatsApp</a>
  </div>
</footer>

<script>
  const productos = [
    { nombre: "Remera Oversize", precio: 8000, categoria: "remeras", imagen: "https://via.placeholder.com/300" },
    { nombre: "Remera Básica", precio: 6000, categoria: "remeras", imagen: "https://via.placeholder.com/300" },
    { nombre: "Pantalón Jeans", precio: 15000, categoria: "pantalones", imagen: "https://via.placeholder.com/300" },
    { nombre: "Pantalón Jogger", precio: 12000, categoria: "pantalones", imagen: "https://via.placeholder.com/300" },
    { nombre: "Buzo con Capucha", precio: 14000, categoria: "buzos", imagen: "https://via.placeholder.com/300" },
    { nombre: "Buzo Oversize", precio: 16000, categoria: "buzos", imagen: "https://via.placeholder.com/300" }
  ];

  const resenas = [
    { texto: "Excelente servicio y calidad" },
    { texto: "Muy buenos precios" },
    { texto: "Recomendado!" }
  ];

  let modoAdmin = false;

  const listaResenas = document.getElementById("listaResenas");

  function mostrarResenas() {
    listaResenas.innerHTML = "";
    resenas.forEach((r, index) => {
      const div = document.createElement("div");
      div.style.marginBottom = "10px";

      div.innerHTML = `
        <p>⭐️⭐️⭐️⭐️⭐️ "${r.texto}"</p>
        ${modoAdmin ? `<button onclick="eliminarResena(${index})">Eliminar</button>` : ""}
      `;

      listaResenas.appendChild(div);
    });
  }

  function eliminarResena(index) {
    resenas.splice(index, 1);
    mostrarResenas();
  }

  function activarModoAdmin() {
    const pass = document.getElementById("adminPass").value;
    if (pass === "1234") {
      modoAdmin = true;
      alert("Modo administrador activado");
      mostrarResenas();
    } else {
      alert("Clave incorrecta");
    }
  }

  function mostrarLoginAdmin() {
    document.getElementById("adminPanel").style.display = "block";
  }

  const contenedor = document.getElementById("productos");

  mostrarResenas();

  function mostrarProductos(lista) {
    contenedor.innerHTML = "";
    lista.forEach(p => {
      const div = document.createElement("div");
      div.classList.add("card");
      div.innerHTML = `
        <img src="${p.imagen}">
        <h3>${p.nombre}</h3>
        <p class="precio">$${p.precio}</p>
      `;
      contenedor.appendChild(div);
    });
  }

  function filtrarProductos() {
    const texto = document.getElementById("busqueda").value.toLowerCase();
    const filtrados = productos.filter(p => 
      p.nombre.toLowerCase().includes(texto)
    );
    mostrarProductos(filtrados);
  }

  function filtrarCategoria(categoria) {
    if (categoria === 'todos') {
      mostrarProductos(productos);
    } else {
      const filtrados = productos.filter(p => p.categoria === categoria);
      mostrarProductos(filtrados);
    }
  }

  function mostrarSeccion(id) {
    document.querySelectorAll("section").forEach(sec => sec.classList.remove("activo"));
    document.getElementById(id).classList.add("activo");
  }

  mostrarProductos(productos);
</script>

</body>
</html>
