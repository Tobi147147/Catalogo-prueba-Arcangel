<!-- // ======================= index.html ======================= -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Indumentaria</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<header>
  <nav>
    <a onclick="mostrarSeccion('catalogo')">Catálogo</a>
    <a onclick="mostrarSeccion('ubicacion')">Ubicación</a>
    <a onclick="mostrarSeccion('resenas')">Reseñas</a>
  </nav>
  <input type="text" id="busqueda" class="buscador" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
</header>

<section id="catalogo" class="activo">
  <h2>Catálogo de Indumentaria</h2>

  <div class="filtros">
    <button onclick="filtrarCategoria('todos')">Todos</button>
    <button onclick="filtrarCategoria('remeras')">Remeras</button>
    <button onclick="filtrarCategoria('pantalones')">Pantalones</button>
    <button onclick="filtrarCategoria('buzos')">Buzos</button>
  </div>

  <div class="contenedor" id="productos"></div>
</section>

<section id="ubicacion">
  <h2>Ubicación</h2>
  <p>Buenos Aires, Argentina</p>
  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d52618.805410049106!2d-58.80208969116212!3d-34.485759479974725!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bca3e0df787f57%3A0x830bc071a391b274!2sTienda%20de%20Ropa%20%7C%20Arcangel%20%7C%20Gorras%20y%20Calzado!5e0!3m2!1ses-419!2sar!4v1773873676848!5m2!1ses-419!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</section>

<section id="resenas">
  <h2>Reseñas</h2>
  <div id="listaResenas"></div>
  <button onclick="mostrarLoginAdmin()">Modo Admin</button>
  <div id="adminPanel" style="display:none;">
    <input type="password" id="adminPass" placeholder="Clave">
    <button onclick="activarModoAdmin()">Entrar</button>
  </div>
</section>

<footer>
  <p>Redes</p>
  <a href="#">Instagram</a>
  <a href="#">Facebook</a>
  <a href="#">WhatsApp</a>
</footer>

<script src="scripts/app.js"></script>
</body>
</html>
